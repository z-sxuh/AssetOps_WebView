<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f8" />
    <title>工作台 · 1.2.5 HTML 原型</title>
    <script>
      const storedTheme = localStorage.getItem('assetops-theme');
      const startupTheme = ['light', 'dark', 'spring', 'system'].includes(storedTheme) ? storedTheme : 'spring';
      document.documentElement.dataset.theme = startupTheme === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : startupTheme;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
