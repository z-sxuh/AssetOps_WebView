[package]
name = "assetops"
version = "1.2.5"
description = "工作台：本地离线资产与运维管理"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "7"
base64 = "0.22"
aes-gcm = "0.11"
argon2 = "0.5"
calamine = "0.36"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
rust_xlsxwriter = "0.99"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
zeroize = "1"
trash = "5.2.9"
zip = { version = "8.6", default-features = false }
flate2 = "1.1"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.1"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
